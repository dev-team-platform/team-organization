<tp-dialog
  [(open)]="open"
  [ariaLabel]="ariaLabel()"
  [width]="width()"
  [maxWidth]="maxWidth()"
  [height]="height()"
  [maxHeight]="maxHeight()"
>
  <div class="to-title-dialog">
    <header class="to-title-dialog__header">
      <h2 class="to-title-dialog__title">
        @if (titleTemplate(); as template) {
          <ng-container [ngTemplateOutlet]="template"></ng-container>
        } @else {
          {{ titleText() }}
        }
      </h2>

      <tp-text-button
        class="to-title-dialog__close"
        color="gray"
        pressEffectShape="circle"
        hoverShape="circle"
        width="32px"
        height="32px"
        tooltipTitle="Close dialog"
        (onClick)="close()"
      >
        <span class="tp-icon material-symbols-outlined">close</span>
      </tp-text-button>
    </header>

    <tp-divider
      class="to-title-dialog__divider"
      [width]="width()"
      [maxWidth]="maxWidth()"
    ></tp-divider>

    <section class="to-title-dialog__body">
      @if (bodyTemplate(); as template) {
        <ng-container [ngTemplateOutlet]="template"></ng-container>
      }
    </section>

    <tp-divider
      class="to-title-dialog__divider"
      [width]="width()"
      [maxWidth]="maxWidth()"
    ></tp-divider>

    <footer class="to-title-dialog__footer">
      @if (footerTemplate(); as template) {
        <ng-container [ngTemplateOutlet]="template"></ng-container>
      }
    </footer>
  </div>
</tp-dialog>
