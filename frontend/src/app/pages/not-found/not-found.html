<section class="tt-not-found" aria-labelledby="not-found-title">
  <div class="tt-not-found__content">
    <div class="tt-not-found__summary">
      <span class="tp-icon tt-not-found__icon" aria-hidden="true">search_off</span>
    </div>

    <h1 id="not-found-title" class="tt-not-found__title">Page not found</h1>

    <p class="tt-not-found__description">
      The page you requested is unavailable or has moved to another location.
    </p>

    <tp-button
      class="tt-not-found__home-button"
      color="blue"
      variant="tonal"
      width="150px"
      height="40px"
      (onClick)="goHome()"
    >
      <span class="tp-icon">home</span>
      <span>Return home</span>
    </tp-button>
  </div>
</section>
